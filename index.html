<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard 1er Parcial - Desarrollo de Software</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-6 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-blue-400">📊 Dashboard de Calificaciones</h1>
                <p class="text-slate-400 text-sm md:text-base">Desarrollo de Software con Herramientas | 1er Parcial</p>
            </div>
            <div class="flex items-center gap-2 bg-slate-700 px-4 py-2 rounded-lg">
                <span class="text-slate-300 text-sm">Total Alumnos:</span>
                <span id="totalStudents" class="text-xl font-bold text-white">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Stats Cards -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                <p class="text-slate-400 text-xs uppercase tracking-wider">Promedio General</p>
                <p id="statAvg" class="text-3xl font-bold text-blue-400 mt-1">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                <p class="text-slate-400 text-xs uppercase tracking-wider">Aprobados (≥60)</p>
                <p id="statPass" class="text-3xl font-bold text-green-400 mt-1">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                <p class="text-slate-400 text-xs uppercase tracking-wider">Calificación Más Alta</p>
                <p id="statMax" class="text-3xl font-bold text-emerald-400 mt-1">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                <p class="text-slate-400 text-xs uppercase tracking-wider">Total de Faltas</p>
                <p id="statAbs" class="text-3xl font-bold text-red-400 mt-1">0</p>
            </div>
        </section>

        <!-- Controls -->
        <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Controles y Búsqueda</h2>
            <div class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="searchInput" placeholder="🔍 Buscar alumno por nombre..." class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="sortSelect" class="bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="name-asc">Nombre (A-Z)</option>
                    <option value="name-desc">Nombre (Z-A)</option>
                    <option value="avg-desc">Promedio (Mayor a Menor)</option>
                    <option value="avg-asc">Promedio (Menor a Mayor)</option>
                    <option value="abs-desc">Faltas (Mayor a Menor)</option>
                </select>
            </div>
            <div class="mt-4 grid grid-cols-2 md:grid-cols-3 gap-2 text-xs text-slate-400">
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-green-500"></span> Excelente (≥65)</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-yellow-500"></span> Regular (60-64)</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-red-500"></span> Reprobado (<60)</div>
            </div>
        </section>

        <!-- Data Table -->
        <section class="bg-slate-800 rounded-xl border border-slate-700 shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-slate-300">
                    <thead class="text-xs text-slate-400 uppercase bg-slate-700/50 sticky top-0">
                        <tr>
                            <th class="px-6 py-3 whitespace-nowrap">Alumno</th>
                            <th class="px-6 py-3 text-center">Promedio</th>
                            <th class="px-6 py-3 text-center">Faltas</th>
                            <th class="px-6 py-3 text-center">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-700">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // --- DATA ---
        const students = [
            { name: "ALVAREZ OLIVARRA ARIATHNA BETZABE", avg: 62, abs: 0 },
            { name: "AMARILLAS ALMADA ALFREDO", avg: 69, abs: 0 },
            { name: "ARGÜELLES APODACA EMILY YORLEI", avg: 62, abs: 0 },
            { name: "ARZOLA SOTO EDUARDO ALBERTO", avg: 69, abs: 0 },
            { name: "BENITEZ MEDINA ISMAEL", avg: 69, abs: 1 },
            { name: "CORRAL CASTILLO KENNETH ALEXANDER", avg: 69, abs: 0 },
            { name: "COTA NUÑEZ KEVIN", avg: 69, abs: 0 },
            { name: "CUEVAS MARTINEZ MIGUEL ANTONIO", avg: 67, abs: 0 },
            { name: "DOMINGUEZ FELIX MAURO DAMIAN", avg: 43, abs: 3 },
            { name: "DOMINGUEZ LEYVA JUAN EDUARDO", avg: 69, abs: 0 },
            { name: "DUARTE RIOS LUIS FRANCISCO", avg: 69, abs: 2 },
            { name: "ELIOPULOS MONTAÑO JORGE EMILIANO", avg: 69, abs: 0 },
            { name: "ESQUER VALENZUELA BRAYAN JESUS", avg: 68, abs: 0 },
            { name: "GARATUZA HERNANDEZ EMILIANO", avg: 68, abs: 0 },
            { name: "GARCIA CAMACHO MIGUEL ARMANDO", avg: 67, abs: 0 },
            { name: "GARCIA ROJAS DANIELA", avg: 68, abs: 0 },
            { name: "GASTELUM FRANCO DIEGO ALEJANDRO", avg: 56, abs: 2 },
            { name: "GUTIÉRREZ CORONA JUAN LUIS", avg: 55, abs: 1 },
            { name: "HERNANDEZ OLEA EMILIANO", avg: 61, abs: 1 },
            { name: "HERRERA MORENO KRISTHIAN ABDIEL", avg: 67, abs: 1 },
            { name: "JIMENEZ CAMPOA JUAN CARLOS", avg: 69, abs: 1 },
            { name: "LARA LEYVA JOAN ERNESTO", avg: 69, abs: 0 },
            { name: "MACHADO BELTRAN LILIA PAULINA", avg: 67, abs: 0 },
            { name: "MEDRANO QUINTERO MARIA CRISTINA", avg: 54, abs: 1 },
            { name: "MENESES MONTIJO ANYYA YARETHZI", avg: 69, abs: 1 },
            { name: "MORENO VILLANUEVA FRANCISCO YAHIR", avg: 69, abs: 0 },
            { name: "NUÑEZ BERNAL JUAN MANUEL", avg: 68, abs: 1 },
            { name: "OCHOA GALVEZ DANIELL ALELY", avg: 69, abs: 0 },
            { name: "OLIVA MARTINEZ AYLIN ALEXIA", avg: 67, abs: 2 },
            { name: "PERAL JIMENEZ VALERIA GUADALUPE", avg: 54, abs: 0 },
            { name: "PERAZA MARTINEZ REGINA VALERIA", avg: 69, abs: 0 },
            { name: "QUESNEY ESPINOZA LESLIE", avg: 55, abs: 4 },
            { name: "RABAGO SALINAS JESUS ROBERTO", avg: 55, abs: 1 },
            { name: "RAMIREZ VAZQUEZ LUIS RUBEN", avg: 69, abs: 1 },
            { name: "RIOS CAMPOS ORLANDO ADRIEL", avg: 67, abs: 1 },
            { name: "SALAZAR CASTRO ANEL MICHELL", avg: 62, abs: 5 },
            { name: "SAUCEDA BERNAL ANGEL URIEL", avg: 67, abs: 2 },
            { name: "VALDEZ LUJAN DIANA MARIA", avg: 69, abs: 1 },
            { name: "VALENZUELA DE LA VEGA JORGE ADRIAN", avg: 43, abs: 0 },
            { name: "ZEPEDA ALVAREZ CARLOS ISAAC", avg: 45, abs: 2 }
        ];

        // --- STATS CALCULATION ---
        const totalStudents = students.length;
        const classAvg = (students.reduce((a, b) => a + b.avg, 0) / totalStudents).toFixed(1);
        const passingStudents = students.filter(s => s.avg >= 60).length;
        const maxAvg = Math.max(...students.map(s => s.avg));
        const totalAbs = students.reduce((a, b) => a + b.abs, 0);

        document.getElementById('totalStudents').innerText = totalStudents;
        document.getElementById('statAvg').innerText = classAvg;
        document.getElementById('statPass').innerText = `${passingStudents}/${totalStudents}`;
        document.getElementById('statMax').innerText = maxAvg;
        document.getElementById('statAbs').innerText = totalAbs;

        // --- TABLE RENDERING ---
        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');

        function getStatus(avg) {
            if (avg >= 65) return { text: 'Excelente', color: 'bg-green-500/20 text-green-400 border-green-500/50' };
            if (avg >= 60) return { text: 'Aprobado', color: 'bg-yellow-500/20 text-yellow-400 border-yellow-500/50' };
            return { text: 'Reprobado', color: 'bg-red-500/20 text-red-400 border-red-500/50' };
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
            data.forEach((s) => {
                const status = getStatus(s.avg);
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-700/50 transition-colors';
                
                row.innerHTML = `
                    <td class="px-6 py-4 font-medium text-white whitespace-nowrap">${s.name}</td>
                    <td class="px-6 py-4 text-center font-bold ${s.avg < 60 ? 'text-red-400' : 'text-white'}">${s.avg}</td>
                    <td class="px-6 py-4 text-center">
                        <span class="${s.abs > 0 ? 'text-red-400 font-bold' : 'text-slate-500'}">${s.abs}</span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <span class="px-2 py-1 rounded-full text-xs border ${status.color}">${status.text}</span>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function filterAndSort() {
            const searchTerm = searchInput.value.toLowerCase();
            const sortVal = sortSelect.value;
            
            let filtered = students.filter(s => s.name.toLowerCase().includes(searchTerm));
            
            filtered.sort((a, b) => {
                switch(sortVal) {
                    case 'name-asc': return a.name.localeCompare(b.name);
                    case 'name-desc': return b.name.localeCompare(a.name);
                    case 'avg-desc': return b.avg - a.avg;
                    case 'avg-asc': return a.avg - b.avg;
                    case 'abs-desc': return b.abs - a.abs;
                    default: return 0;
                }
            });
            
            renderTable(filtered);
        }

        searchInput.addEventListener('input', filterAndSort);
        sortSelect.addEventListener('change', filterAndSort);
        
        // Initial render
        filterAndSort();
    </script>
</body>
</html>
